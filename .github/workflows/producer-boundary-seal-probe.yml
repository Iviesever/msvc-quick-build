name: Producer boundary IPC prerequisite 006

on:
  push:
    branches: ['feat/producer-clean-handoff-20261011']
    paths:
      - 'tests/native/producer_delegation_probe.cpp'
      - 'tests/native/run_producer_delegation_probe.py'
      - 'tests/native/run_producer_boundary_seal_probe.py'
      - 'tests/native/producer_probe_job.py'
      - '.github/workflows/producer-boundary-seal-probe.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  necessary-primitives:
    if: github.run_number == 6 && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One reviewed fixture build and one native IPC invocation
        shell: pwsh
        run: >-
          python -B tests/native/run_producer_delegation_probe.py
          --expected-probe-sha256 0c5e0140950fdee99fb54f90c8fdb5410f569f3e7e9d53ff576e7e2908b76c6f
          --expected-runner-sha256 2921f46bb6da521dd502041a5c5710978cd2bd04af14b3852ac68dd1217fdb3b
          --expected-common-runner-sha256 696ce809f173aa4a04ff90c37d9c87de9883385a242d576740cbe2bf448688e0
          --expected-job-runner-sha256 417b93124c949e52cf2b6ed48445b4f1b275798b99105500d7c2bff8523bdd30
      - name: Retain complete original attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: producer-delegation-006-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            producer-delegation-006-*/**
            tests/native/producer_delegation_probe.cpp
            tests/native/run_producer_delegation_probe.py
            tests/native/run_producer_boundary_seal_probe.py
            tests/native/producer_probe_job.py
            .github/workflows/producer-boundary-seal-probe.yml
            .gitattributes
            docs/20261011-013406-producer-handoff/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
