name: Restore small-target direct scheduling path

on:
  push:
    branches:
      - perf/target-wide-filesystem-evidence
    paths:
      - .github/workflows/restore-small-target-direct-path.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore the historical no-table callback path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in (
              'cpp/src/orchestration/incremental/MsvcIncrementalTargetCoordinator.cpp',
              'cpp/src/orchestration/incremental/MsvcIncrementalStaticTargetCoordinator.cpp',
          ):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              request_type = (
                  'IncrementalStaticTargetRequest'
                  if 'Static' in file.name
                  else 'IncrementalTargetRequest'
              )
              old = f'''    attempts.clear();
              attempts.resize(request.sources.size());

              return BoundedWorkScheduler::run(
                  request.sources.size(),
                  request.max_parallel_compiles,
                  [&](const std::size_t index) {{
                      detail::ScopedFilesystemEvidenceActivation evidence_activation{{
                          evidence_table}};
                      auto compile_request = compile_request_for(
                          request.sources[index],
                          request.compiler_options,
                          force_rebuild);
                      attempts[index].emplace(compile_coordinator.run(compile_request));
                      return attempts[index]->has_value();
                  }});
          '''
              new = f'''    attempts.clear();
              attempts.resize(request.sources.size());

              const auto compile_one = [&](const std::size_t index) {{
                  auto compile_request = compile_request_for(
                      request.sources[index],
                      request.compiler_options,
                      force_rebuild);
                  attempts[index].emplace(compile_coordinator.run(compile_request));
                  return attempts[index]->has_value();
              }};

              // Preserve the exact historical callback path when evidence sharing is
              // disabled. In particular, one- and two-TU targets should not pay even
              // a thread-local activation/deactivation for a table that cannot reduce
              // physical metadata queries after mandatory revalidation.
              if (evidence_table == nullptr) {{
                  return BoundedWorkScheduler::run(
                      request.sources.size(),
                      request.max_parallel_compiles,
                      compile_one);
              }}

              return BoundedWorkScheduler::run(
                  request.sources.size(),
                  request.max_parallel_compiles,
                  [&](const std::size_t index) {{
                      detail::ScopedFilesystemEvidenceActivation evidence_activation{{
                          evidence_table}};
                      return compile_one(index);
                  }});
          '''
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: schedule function body drifted')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_table = '''    detail::FilesystemEvidenceTable filesystem_evidence;
              // The race-safety barrier revalidates every reused dependency once.
              // With only two translation units, one initial observation plus one
              // revalidation is the same two physical probes as the uncached path,
              // so enabling the synchronized table cannot reduce metadata I/O.
              detail::FilesystemEvidenceTable* shared_evidence =
                  request.sources.size() > 2 && !request.force_downstream_rebuild
                  ? &filesystem_evidence
                  : nullptr;
          '''
          new_table = '''    std::optional<detail::FilesystemEvidenceTable> filesystem_evidence;
              // The race-safety barrier revalidates every reused dependency once.
              // With only two translation units, one initial observation plus one
              // revalidation is the same two physical probes as the uncached path.
              // Do not even construct the synchronized table on that break-even path.
              if (request.sources.size() > 2
                  && !request.force_downstream_rebuild) {
                  filesystem_evidence.emplace();
              }
              detail::FilesystemEvidenceTable* shared_evidence =
                  filesystem_evidence ? &*filesystem_evidence : nullptr;
          '''
          for path in (
              'cpp/src/orchestration/incremental/MsvcIncrementalTargetCoordinator.cpp',
              'cpp/src/orchestration/incremental/MsvcIncrementalStaticTargetCoordinator.cpp',
          ):
              replace_once(path, old_table, new_table)

          Path('.github/workflows/restore-small-target-direct-path.yml').unlink()
          PY

      - name: Validate and commit direct path
        shell: bash
        run: |
          git diff --check
          test "$(tr -d '\r\n' < VERSION)" = "5.4.0"
          test ! -e .github/workflows/restore-small-target-direct-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No direct-path refinement produced'; exit 1; }
          git commit -m "perf: keep small targets on the direct compile path"
          git push origin HEAD:perf/target-wide-filesystem-evidence
