name: Retained no-op study (one allocation)
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact formally reviewed main commit (40 lowercase hex characters)'
        required: true
        type: string
      manifest_sha256:
        description: 'Reviewed canonical-LF execution manifest SHA256'
        required: true
        type: string
      allocation:
        description: 'Separately approved allocation: 701-boundary-002 (001 consumed)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-noop-701-boundary-001
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  study:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Record and enforce exact second allocation before downloads
        shell: python {0}
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ALLOCATION: ${{ inputs.allocation }}
        run: |
          import json, os, pathlib, re
          out = pathlib.Path('execution-out'); out.mkdir()
          keys = ('GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_SHA',
                  'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_RUN_ID',
                  'GITHUB_RUN_NUMBER', 'GITHUB_RUN_ATTEMPT', 'REVIEWED_COMMIT',
                  'MANIFEST_SHA256', 'ALLOCATION')
          context = {k: os.environ.get(k) for k in keys}
          with (out/'requested-allocation.json').open('x', encoding='utf-8') as f:
              json.dump(context, f, indent=2)
          if not (context['GITHUB_REPOSITORY'] == 'Iviesever/msvc-quick-build'
                  and context['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                  and context['GITHUB_REF'] == 'refs/heads/main'
                  and context['GITHUB_WORKFLOW_REF'] == 'Iviesever/msvc-quick-build/.github/workflows/retained-noop-study.yml@refs/heads/main'
                  and context['GITHUB_RUN_NUMBER'] == '2'
                  and context['GITHUB_RUN_ATTEMPT'] == '1'
                  and re.fullmatch('[1-9][0-9]*', context['GITHUB_RUN_ID'] or '')
                  and context['GITHUB_RUN_ID'] != '35725316959'
                  and context['ALLOCATION'] == '701-boundary-002'
                  and re.fullmatch('[0-9a-f]{40}', context['REVIEWED_COMMIT'] or '')
                  and context['GITHUB_SHA'] == context['GITHUB_WORKFLOW_SHA'] == context['REVIEWED_COMMIT']
                  and re.fullmatch('[0-9a-f]{64}', context['MANIFEST_SHA256'] or '')):
              raise SystemExit('REFUSED: not reviewed 002/run2/attempt1; 001 consumed, no automatic next allocation.')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: checkout
          persist-credentials: false
      - name: Download only original retained ZIP without decompression
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: '10675079360'
          repository: Iviesever/msvc-quick-build
          run-id: '35681224762'
          github-token: ${{ github.token }}
          path: execution-out/download
          skip-decompress: true
          digest-mismatch: error
      - name: Download immutable stopped 001 evidence without decompression
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: '10693057419'
          repository: Iviesever/msvc-quick-build
          run-id: '35725316959'
          github-token: ${{ github.token }}
          path: execution-out/history
          skip-decompress: true
          digest-mismatch: error
      - name: Invoke frozen collector once (at most 40 study calls)
        shell: pwsh
        timeout-minutes: 15
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ALLOCATION: ${{ inputs.allocation }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'execution-out'
          $log = Join-Path $out 'executor.log'
          try {
            $files = @(Get-ChildItem (Join-Path $out 'download') -File -Recurse -Force)
            if ($files.Count -ne 1 -or $files[0].Extension -ne '.zip') { throw 'Expected one original archive, not extracted input.' }
            $history = @(Get-ChildItem (Join-Path $out 'history') -File -Recurse -Force)
            if ($history.Count -ne 1 -or $history[0].Extension -ne '.zip') { throw 'Expected one original stopped 001 archive.' }
            & ./checkout/tests/native/run_retained_noop_study.ps1 -ArtifactPath $files[0].FullName `
              -PreviousArtifactPath $history[0].FullName `
              -OutputRoot (Join-Path $out 'evidence') -ReviewedCommit $env:REVIEWED_COMMIT `
              -ManifestSha256 $env:MANIFEST_SHA256 -Allocation $env:ALLOCATION *> $log
          } catch {
            $_ | Out-String | Add-Content $log
            throw
          } finally {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          }
      - name: Preserve original input and all available evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: retained-noop-701-boundary-002-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: execution-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
# Same workflow/path/name and concurrency lock: 001/run1 is consumed_stopped.
# Only separately frozen 002/run2/attempt1; no automatic 003, resume or refill.
# No push/PR/schedule trigger; this dispatch consumes 002 even on failure.
