name: Native C++

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'tests/native/**'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'tests/native/**'
      - '.github/workflows/native-ci.yml'

concurrency:
  group: native-cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-current:
    name: Build current Debug MQB + shared test library
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build current Debug MQB with MQB
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version "$version-dev" `
            -Configuration Debug `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/debug/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Debug MQB build output missing: $mqb"
          }

      - name: Verify ambient MSVC option isolation
        shell: pwsh
        env:
          CL: /FI_mqb_ambient_cl_should_never_exist_.hpp
          _CL_: /Fo_mqb_ambient_cl_should_never_exist_.obj
          LINK: /DEF:_mqb_ambient_link_should_never_exist_.def
          _LINK_: /OUT:_mqb_ambient_link_should_never_exist_.exe
        run: |
          $mqb = (Resolve-Path -LiteralPath 'native-out/debug/mqb.exe').Path
          $fixture = Join-Path $PWD 'native-out/ambient-msvc-option-isolation'
          if (Test-Path -LiteralPath $fixture) {
            Remove-Item -LiteralPath $fixture -Recurse -Force
          }
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null

          $ordinary = Join-Path $fixture 'ordinary'
          New-Item -ItemType Directory -Path $ordinary -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $ordinary 'main.cpp') -Encoding utf8 -Value 'int main() { return 0; }'
          Push-Location $ordinary
          try {
            & $mqb run main.cpp --no-discover
            if ($LASTEXITCODE -ne 0) {
              throw "ordinary build/run observed ambient CL/_CL_/LINK/_LINK_ options"
            }
          } finally {
            Pop-Location
          }

          $modules = Join-Path $fixture 'modules'
          New-Item -ItemType Directory -Path $modules -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $modules 'math.ixx') -Encoding utf8 -Value 'export module math; export int answer() { return 42; }'
          Set-Content -LiteralPath (Join-Path $modules 'main.cpp') -Encoding utf8 -Value 'import math; int main() { return answer() == 42 ? 0 : 1; }'
          Push-Location $modules
          try {
            & $mqb run main.cpp math.ixx --no-discover
            if ($LASTEXITCODE -ne 0) {
              throw "module scan/build/run observed ambient CL/_CL_/LINK/_LINK_ options"
            }
          } finally {
            Pop-Location
          }

      - name: Build shared Debug native-test product library
        shell: pwsh
        run: |
          $mqb = Join-Path $PWD 'native-out/debug/mqb.exe'
          $library = & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath $mqb `
            -TestMqbPath $mqb `
            -RepoRoot $PWD `
            -Configuration Debug `
            -PrepareSharedProductLibraryPath (Join-Path $PWD 'native-out/debug/native-test-product.lib')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Shared Debug native-test product library missing: $library"
          }

      - name: Verify exact MSVC parameter inventory
        shell: pwsh
        run: |
          $mqb = Join-Path $PWD 'native-out/debug/mqb.exe'
          $library = Join-Path $PWD 'native-out/debug/native-test-product.lib'
          & (Join-Path $PWD 'tests/native/verify_msvc_parameter_inventory.ps1') `
            -MqbPath $mqb `
            -RepoRoot $PWD `
            -Configuration Debug `
            -SharedProductLibraryPath $library `
            -OutputPath (Join-Path $PWD 'native-out/debug/msvc-parameter-inventory.tsv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact Debug MQB and shared product library
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-mqb
          path: |
            native-out/debug/mqb.exe
            native-out/debug/native-test-product.lib
            native-out/debug/msvc-parameter-inventory.tsv
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: Native Debug tests ${{ matrix.shard }}/4
    needs: build-current
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            subshard_a: 0
            subshard_b: 1
          - shard: 1
            subshard_a: 2
            subshard_b: 3
          - shard: 2
            subshard_a: 4
            subshard_b: 5
          - shard: 3
            subshard_a: 6
            subshard_b: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact Debug MQB and shared product library
        uses: actions/download-artifact@v8
        with:
          name: native-debug-mqb
          path: native-out/debug

      - name: Run paired MQB-native Debug subshards
        shell: pwsh
        run: |
          $mqb = Join-Path $PWD 'native-out/debug/mqb.exe'
          $library = Join-Path $PWD 'native-out/debug/native-test-product.lib'
          & (Join-Path $PWD 'tests/native/run_paired_native_subshards.ps1') `
            -BuilderMqbPath $mqb `
            -TestMqbPath $mqb `
            -RepoRoot $PWD `
            -Configuration Debug `
            -SharedProductLibraryPath $library `
            -OuterShardIndex ${{ matrix.shard }} `
            -OuterShardCount 4 `
            -SubshardA ${{ matrix.subshard_a }} `
            -SubshardB ${{ matrix.subshard_b }} `
            -ShardCount 8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-and-test:
    name: Native C++ gate
    if: always()
    needs:
      - build-current
      - test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require build and every shard
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-current.result }}
          TEST_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          echo "build-current: $BUILD_RESULT"
          echo "test-shard:    $TEST_RESULT"
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            exit 1
          fi
