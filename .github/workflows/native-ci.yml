name: Native C++

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'tests/native/**'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'tests/native/**'
      - '.github/workflows/native-ci.yml'

concurrency:
  group: native-cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-current:
    name: Build current Debug MQB + shared test library
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build current Debug MQB with MQB
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version "$version-dev" `
            -Configuration Debug `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/debug/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Debug MQB build output missing: $mqb"
          }

      - name: Build shared Debug native-test product library
        shell: pwsh
        run: |
          $mqb = Join-Path $PWD 'native-out/debug/mqb.exe'
          $library = & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath $mqb `
            -TestMqbPath $mqb `
            -RepoRoot $PWD `
            -Configuration Debug `
            -PrepareSharedProductLibraryPath (Join-Path $PWD 'native-out/debug/native-test-product.lib')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Shared Debug native-test product library missing: $library"
          }

      - name: Upload exact Debug MQB and shared product library
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-mqb
          path: |
            native-out/debug/mqb.exe
            native-out/debug/native-test-product.lib
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: Native Debug tests ${{ matrix.shard }}/4
    needs: build-current
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact Debug MQB and shared product library
        uses: actions/download-artifact@v8
        with:
          name: native-debug-mqb
          path: native-out/debug

      - name: Run two MQB-native Debug subshards
        shell: pwsh
        run: |
          $repoRoot = $PWD.Path
          $mqb = Join-Path $repoRoot 'native-out/debug/mqb.exe'
          $library = Join-Path $repoRoot 'native-out/debug/native-test-product.lib'
          $testScript = Join-Path $repoRoot 'tests/native/run_native_tests.ps1'
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Downloaded Debug MQB missing: $mqb"
          }
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Downloaded shared Debug native-test product library missing: $library"
          }

          # Keep the four hosted runners from #63/#65, but run two independent
          # weighted subshards concurrently inside each runner. The global
          # ShardCount=8 plan remains deterministic; outer runner N owns
          # subshards 2N and 2N+1, so every one of the 67 tests runs exactly once.
          #
          # Each subshard gets its own pwsh.exe process instead of an in-process
          # parallel runspace because run_native_tests.ps1 intentionally uses
          # `exit` to communicate success/failure. Process isolation preserves
          # that contract and makes the child exit code unambiguous.
          $outerShard = [int]'${{ matrix.shard }}'
          $firstSubshard = $outerShard * 2
          $subshards = @($firstSubshard, $firstSubshard + 1)
          $logRoot = Join-Path $repoRoot "native-test-work/debug/outer-$outerShard-of-4/subshard-logs"
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          $pwshExe = (Get-Command pwsh -ErrorAction Stop).Source

          $children = @(
            foreach ($subshard in $subshards) {
              $stdout = Join-Path $logRoot "subshard-$subshard.stdout.log"
              $stderr = Join-Path $logRoot "subshard-$subshard.stderr.log"
              $arguments = @(
                '-NoLogo',
                '-NoProfile',
                '-NonInteractive',
                '-File', $testScript,
                '-BuilderMqbPath', $mqb,
                '-TestMqbPath', $mqb,
                '-RepoRoot', $repoRoot,
                '-Configuration', 'Debug',
                '-ShardIndex', [string]$subshard,
                '-ShardCount', '8',
                '-SharedProductLibraryPath', $library
              )
              $process = Start-Process `
                -FilePath $pwshExe `
                -ArgumentList $arguments `
                -PassThru `
                -NoNewWindow `
                -RedirectStandardOutput $stdout `
                -RedirectStandardError $stderr

              [PSCustomObject]@{
                Index = $subshard
                Process = $process
                Stdout = $stdout
                Stderr = $stderr
              }
            }
          )

          foreach ($child in $children) {
            $child.Process.WaitForExit()
          }

          $failed = $false
          foreach ($child in @($children | Sort-Object Index)) {
            Write-Host ""
            Write-Host "===== Debug subshard $($child.Index)/8 ====="
            if (Test-Path -LiteralPath $child.Stdout) {
              Get-Content -LiteralPath $child.Stdout | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path -LiteralPath $child.Stderr) {
              $stderrLines = @(Get-Content -LiteralPath $child.Stderr)
              if ($stderrLines.Count -ne 0) {
                Write-Host "----- stderr -----"
                $stderrLines | ForEach-Object { Write-Host $_ }
              }
            }
            $exitCode = $child.Process.ExitCode
            if ($exitCode -ne 0) {
              Write-Host "FAIL: Debug subshard $($child.Index)/8 exited $exitCode"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  build-and-test:
    name: Native C++ gate
    if: always()
    needs:
      - build-current
      - test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require build and every shard
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-current.result }}
          TEST_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          echo "build-current: $BUILD_RESULT"
          echo "test-shard:    $TEST_RESULT"
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            exit 1
          fi
