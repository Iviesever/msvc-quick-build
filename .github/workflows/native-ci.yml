name: Native C++

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'cpp/**'
      - 'README.md'
      - 'docs/**'
      - 'install.bat'
      - 'install.ps1'
      - 'uninstall.ps1'
      - 'tests/installer/**'
      - 'tests/selfhost/**'
      - 'release/**'
      - '.github/workflows/native-ci.yml'
      - '.github/workflows/native-installer.yml'
      - '.github/workflows/native-release.yml'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S cpp -B cpp/build -G "Visual Studio 18 2026" -A x64 -DMQB_ENABLE_INSTALLED_MSVC_TESTS=ON

      - name: Build
        run: cmake --build cpp/build --config Debug --parallel

      - name: Test
        run: ctest --test-dir cpp/build -C Debug --output-on-failure
