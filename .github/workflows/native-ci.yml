name: Native C++

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'README.md'
      - 'README_EN.md'
      - 'LICENSE'
      - 'docs/**'
      - 'install.bat'
      - 'install.ps1'
      - 'uninstall.ps1'
      - 'tests/installer/**'
      - 'tests/native/**'
      - 'tests/selfhost/**'
      - '.github/workflows/native-ci.yml'
      - '.github/workflows/native-installer.yml'
      - '.github/workflows/native-release.yml'

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build current Debug MQB with MQB
        id: build
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version "$version-dev" `
            -Configuration Debug `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/debug/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$mqb" >> $env:GITHUB_OUTPUT

      - name: Run MQB-native Debug tests
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath '${{ steps.build.outputs.path }}' `
            -TestMqbPath '${{ steps.build.outputs.path }}' `
            -RepoRoot $PWD `
            -Configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
