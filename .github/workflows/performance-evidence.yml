name: Performance Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

jobs:
  compare:
    name: Compare base and candidate
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.pull_request.title, 'perf:') && (github.event.action != 'edited' || github.event.changes.title.from != null))
    # Only admitted comparison jobs join this group. A skipped body-edit event
    # must not cancel or replace a queued/running measurement. Preserve started
    # evidence even when a later admitted candidate arrives; pending slots still
    # follow GitHub's default queue policy and are not completion evidence.
    concurrency:
      group: performance-evidence-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate

      - name: Verify performance workflow admission policy
        shell: pwsh
        run: |
          python candidate/tests/native/verify_performance_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout exact PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Checkout baseline for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: main
          path: baseline

      - name: Acquire one pinned historical MQB seed
        id: seed
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $seed = & (Join-Path $candidateRoot 'tests/native/acquire_seed.ps1') `
            -RepoRoot $candidateRoot `
            -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'performance-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build exact baseline Release MQB
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          $version = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          $output = Join-Path $env:GITHUB_WORKSPACE 'performance-out/baseline/mqb.exe'
          $mqb = & (Join-Path $root 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $root `
            -Version $version `
            -Configuration Release `
            -Clean `
            -OutputPath $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Baseline Release MQB missing: $mqb"
          }

      - name: Build candidate Release MQB
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $version = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          $output = Join-Path $env:GITHUB_WORKSPACE 'performance-out/candidate/mqb.exe'
          $mqb = & (Join-Path $root 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $root `
            -Version $version `
            -Configuration Release `
            -Clean `
            -OutputPath $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Candidate Release MQB missing: $mqb"
          }

      - name: Preserve exact measured inputs before instrumentation
        shell: python {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          SEED_PATH: ${{ steps.seed.outputs.path }}
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path('performance-out')
          evidence = root / 'provenance'
          evidence.mkdir()
          def git(side, *args):
              return subprocess.check_output(['git', '-C', side, *args], text=True).strip()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          inputs = {}
          for side, expected in [('baseline', os.environ['EXPECTED_BASE']), ('candidate', os.environ['EXPECTED_HEAD'])]:
              sha = git(side, 'rev-parse', 'HEAD')
              if expected:
                  assert sha == expected, (side, sha, expected)
              assert git(side, 'status', '--porcelain', '--untracked-files=no') == ''
              archive = evidence / (side + '-source.zip')
              subprocess.run(['git', '-C', side, 'archive', '-o', str(archive.resolve()), 'HEAD'], check=True)
              binary = root / side / 'mqb.exe'
              inputs[side] = dict(sha=sha, tree=git(side, 'rev-parse', 'HEAD^{tree}'),
                  version=(pathlib.Path(side)/'VERSION').read_text().strip(),
                  binary_sha256=digest(binary), source_zip_sha256=digest(archive))
          seed = evidence / 'seed.exe'
          shutil.copyfile(os.environ['SEED_PATH'], seed)
          value = dict(run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              inputs=inputs, seed_sha256=digest(seed),
              image=os.environ.get('ImageVersion'), phase='before-instrumentation')
          (evidence/'identity-before.json').write_text(json.dumps(value, indent=2), encoding='utf-8')

      - name: Verify candidate performance instrumentation contract
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $candidateMqb = Join-Path $env:GITHUB_WORKSPACE 'performance-out/candidate/mqb.exe'
          & (Join-Path $candidateRoot 'tests/native/verify_performance_instrumentation.ps1') `
            -MqbPath $candidateMqb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare paired ABBA samples on the same runner
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baselineMqb = Join-Path $env:GITHUB_WORKSPACE 'performance-out/baseline/mqb.exe'
          $candidateMqb = Join-Path $env:GITHUB_WORKSPACE 'performance-out/candidate/mqb.exe'
          $comparison = Join-Path $env:GITHUB_WORKSPACE 'performance-out/benchmark-comparison.json'
          & (Join-Path $candidateRoot 'tests/native/compare_mqb_benchmarks.ps1') `
            -BaselineMqbPath $baselineMqb `
            -CandidateMqbPath $candidateMqb `
            -Iterations 4 `
            -OutputPath $comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish paired comparison summary
        shell: pwsh
        run: |
          $comparisonPath = Join-Path $env:GITHUB_WORKSPACE 'performance-out/benchmark-comparison.json'
          $report = Get-Content -LiteralPath $comparisonPath -Raw | ConvertFrom-Json
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('## MQB paired ABBA performance evidence')
          $lines.Add('')
          $lines.Add("Execution order: $(@($report.execution_order) -join ' → ')")
          $lines.Add('Negative deltas mean the candidate is faster. MAD and P95 are calculated from paired candidate-minus-baseline deltas; P95 uses nearest-rank.')
          $lines.Add('')
          $lines.Add('| Scenario | Base median ms | Candidate median ms | Paired median Δms | Paired median Δ% | MAD Δms | P95 Δms |')
          $lines.Add('|---|---:|---:|---:|---:|---:|---:|')
          foreach ($row in @($report.comparison)) {
            $deltaPct = if ($null -eq $row.paired_median_total_delta_pct) { 'n/a' } else { [string]$row.paired_median_total_delta_pct }
            $lines.Add("| $($row.scenario) | $($row.baseline_median_total_ms) | $($row.candidate_median_total_ms) | $($row.paired_median_total_delta_ms) | $deltaPct | $($row.paired_mad_total_delta_ms) | $($row.paired_p95_total_delta_ms) |")
          }

          $lines.Add('')
          $lines.Add('### Candidate warm-path attribution: 129-TU common-header no-op')
          $lines.Add('')
          $lines.Add('| Pair | Orientation | Total ms | Compile inspect ms | Cache read ms | FS snapshot ms | Cache opens | Cache bytes | FS requests | Unique paths | Threads | cl/link/lib | Output lines/bytes |')
          $lines.Add('|---:|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|')
          $evidenceRows = @($report.paired_samples | Where-Object { $_.scenario -eq 'target-scale-common-header-no-op' } | Sort-Object pair)
          foreach ($pair in $evidenceRows) {
            $candidate = $pair.candidate
            $work = $candidate.attribution.work
            $counters = $candidate.counters
            $processes = "$($counters.cl_processes_launched)/$($counters.link_processes_launched)/$($counters.lib_processes_launched)"
            $output = "$($counters.output_lines_emitted)/$($counters.output_bytes_emitted)"
            $lines.Add("| $($pair.pair) | $($pair.orientation) | $($candidate.total_ms) | $($work.compile_inspection) | $($work.compile_cache_read) | $($work.filesystem_snapshot) | $($counters.cache_files_opened) | $($counters.cache_bytes_read) | $($counters.filesystem_snapshot_requests) | $($counters.unique_filesystem_paths_probed) | $($counters.background_threads_created) | $processes | $output |")
          }
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: One registered private129 product contrast, after independent ABBA
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.ref == 'codex/private129-root-identity-20260918' && github.run_attempt == 1
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python candidate/tests/native/compare_private_root_identity.py --workspace $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify measured binary identities after comparison
        if: always()
        shell: python {0}
        run: |
          import hashlib, json, pathlib
          root = pathlib.Path('performance-out')
          evidence = root / 'provenance'
          before = json.loads((evidence/'identity-before.json').read_text(encoding='utf-8'))
          hashes = {side: hashlib.sha256((root/side/'mqb.exe').read_bytes()).hexdigest()
                    for side in ('baseline', 'candidate')}
          (evidence/'identity-after.json').write_text(json.dumps(hashes, indent=2), encoding='utf-8')
          assert all(hashes[side] == before['inputs'][side]['binary_sha256'] for side in hashes)

      - name: Enforce registered external no-op acceptance
        if: always()
        shell: pwsh
        run: |
          python candidate/tests/native/check_external_noop_gate.py `
            performance-out/benchmark-comparison.json `
            --output performance-out/noop-acceptance.json
          exit $LASTEXITCODE

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mqb-performance-evidence
          path: |
            performance-out/benchmark-comparison.json
            performance-out/noop-acceptance.json
            performance-out/baseline/mqb.exe
            performance-out/candidate/mqb.exe
            performance-out/provenance/
            performance-out/private-root-identity/
          if-no-files-found: error
          retention-days: 30
