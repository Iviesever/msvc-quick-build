name: Module Compile Inspection Evidence

on:
  pull_request:
    paths:
      - 'cpp/include/mqb/orchestration/MsvcModuleCompileCoordinator.hpp'
      - 'cpp/include/mqb/orchestration/MsvcIncrementalCompileCoordinator.hpp'
      - 'cpp/src/orchestration/modules/ModuleCompilePlan.cpp'
      - 'cpp/src/orchestration/modules/ModuleCompilePlan.hpp'
      - 'cpp/src/orchestration/modules/ModuleCompileRequestFactory.cpp'
      - 'cpp/src/orchestration/modules/ModuleCompileRequestFactory.hpp'
      - 'cpp/src/orchestration/modules/MsvcModuleCompileCoordinator.cpp'
      - 'cpp/src/orchestration/incremental/MsvcIncrementalCompileCoordinator.cpp'
      - 'cpp/src/core/**'
      - 'cpp/src/msvc/**'
      - 'cpp/mqb.json'
      - 'tests/native/module_compile_inspection_contract.cpp'
      - 'tests/native/verify_module_compile_inspection.ps1'
      - 'tests/native/assert_cpp_layout.ps1'
      - '.github/workflows/module-compile-inspection-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-compile-inspection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-module-compile-inspection:
    name: Verify side-effect-free module compile inspection
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Verify module compile inspection contract
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/verify_module_compile_inspection.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
