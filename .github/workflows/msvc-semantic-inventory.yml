name: MSVC Semantic Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'cpp/**'
      - 'tests/native/msvc_semantic_variant_inventory.cpp'
      - 'tests/native/verify_msvc_semantic_variant_inventory.ps1'
      - 'docs/MSVC_PARAMETER_COVERAGE.md'
      - '.github/workflows/msvc-semantic-inventory.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'tests/native/msvc_semantic_variant_inventory.cpp'
      - 'tests/native/verify_msvc_semantic_variant_inventory.ps1'
      - 'docs/MSVC_PARAMETER_COVERAGE.md'
      - '.github/workflows/msvc-semantic-inventory.yml'

concurrency:
  group: msvc-semantic-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-inventory:
    name: High-risk semantic variants
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build current Debug MQB with MQB
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version "$version-dev" `
            -Configuration Debug `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/debug/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Debug MQB build output missing: $mqb"
          }

      - name: Build shared Debug product library
        shell: pwsh
        run: |
          $mqb = Join-Path $PWD 'native-out/debug/mqb.exe'
          $library = & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath $mqb `
            -TestMqbPath $mqb `
            -RepoRoot $PWD `
            -Configuration Debug `
            -PrepareSharedProductLibraryPath (Join-Path $PWD 'native-out/debug/native-test-product.lib')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Shared Debug product library missing: $library"
          }

      - name: Verify semantic variant inventory
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/verify_msvc_semantic_variant_inventory.ps1') `
            -MqbPath (Join-Path $PWD 'native-out/debug/mqb.exe') `
            -RepoRoot $PWD `
            -Configuration Debug `
            -SharedProductLibraryPath (Join-Path $PWD 'native-out/debug/native-test-product.lib') `
            -OutputPath (Join-Path $PWD 'native-out/debug/msvc-semantic-variant-inventory.tsv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload semantic inventory evidence
        uses: actions/upload-artifact@v7
        with:
          name: msvc-semantic-variant-inventory
          path: native-out/debug/msvc-semantic-variant-inventory.tsv
          if-no-files-found: error
          retention-days: 7
