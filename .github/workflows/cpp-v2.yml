name: C++ V2

on:
  push:
    branches:
      - refactor/cpp-v2
  pull_request:
    paths:
      - 'cpp/**'
      - 'docs/CPP_V2_ARCHITECTURE.md'
      - '.github/workflows/cpp-v2.yml'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build cpp/build --config Debug --parallel

      - name: Test
        run: ctest --test-dir cpp/build -C Debug --output-on-failure
