name: Foreground Failure Recovery

on:
  pull_request:
    paths:
      - 'cpp/**'
      - 'tests/native/verify_foreground_recovery.py'
      - '.github/workflows/foreground-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foreground-recovery-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    name: Exact-head ${{ matrix.configuration }} foreground recovery
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      GH_TOKEN: ${{ github.token }}
      MQB_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MQB_EXPECTED_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MQB_EXPECTED_HEAD }}
      - name: Preserve exact source and validate collector assertions
        shell: pwsh
        run: |
          if ([int]$env:GITHUB_RUN_ATTEMPT -ne 1) { throw 'Repeated attempts do not replace the first evidence.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:MQB_EXPECTED_HEAD) { throw 'Candidate identity mismatch.' }
          New-Item -ItemType Directory -Path recovery-evidence -ErrorAction Stop | Out-Null
          git -c core.autocrlf=false archive --format=zip --output=recovery-evidence/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ head=$head; tree=(git rev-parse 'HEAD^{tree}').Trim(); base=$env:MQB_EXPECTED_BASE;
             configuration='${{ matrix.configuration }}'; version=(Get-Content VERSION -Raw).Trim(); run=$env:GITHUB_RUN_ID;
             attempt=$env:GITHUB_RUN_ATTEMPT; image=$env:ImageVersion } |
            ConvertTo-Json | Set-Content recovery-evidence/provenance.json -Encoding utf8
          python tests/native/verify_foreground_recovery.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact current MQB from pinned seed
        shell: pwsh
        run: |
          Start-Transcript -Path recovery-evidence/build-transcript.txt
          try {
            $seed = & ./tests/native/acquire_seed.ps1 -RepoRoot $PWD -OutputRoot (Join-Path $PWD 'recovery-seed')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = (Get-Content VERSION -Raw).Trim()
            $mqb = & ./tests/native/build_mqb.ps1 -BuilderMqbPath $seed -RepoRoot $PWD `
              -Version $version -Configuration '${{ matrix.configuration }}' -Clean `
              -OutputPath (Join-Path $PWD 'recovery-evidence/mqb.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-FileHash -Algorithm SHA256 -LiteralPath $seed, $mqb |
              Select-Object Path, Hash | ConvertTo-Json | Set-Content recovery-evidence/binaries.json -Encoding utf8
          } finally { Stop-Transcript }
      - name: Run fixed ordinary and named-module failure-repair sequences
        shell: pwsh
        run: |
          python tests/native/verify_foreground_recovery.py --mqb recovery-evidence/mqb.exe `
            --configuration '${{ matrix.configuration }}' --output recovery-evidence/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original diagnostics, cache generations and partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foreground-recovery-${{ matrix.configuration }}
          path: |
            recovery-evidence/**
            !recovery-evidence/native/**/project-*/.mqb/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
