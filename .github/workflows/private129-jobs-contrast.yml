name: Private129 jobs contrast once

on:
  push:
    branches: ['codex/private129-jobs-contrast-once-20260917']

permissions:
  contents: read
  actions: read

concurrency:
  group: private129-jobs-contrast-once-20260917
  cancel-in-progress: false

jobs:
  contrast:
    # A new push is a new run, not another allocation of this fixed experiment.
    if: github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/codex/private129-jobs-contrast-once-20260917'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pure controller checks and unchanged original archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory private129-output -ErrorAction Stop | Out-Null
          python tests/native/private129_jobs_contrast.py --self-test 1>private129-output/self-test.stdout 2>private129-output/self-test.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          Invoke-WebRequest 'https://api.github.com/repos/Iviesever/msvc-quick-build/actions/artifacts/10317617795/zip' -Headers $headers -OutFile private129-output/original-cumulative.zip
      - name: Fixed 58-call diagnostic; old A/B EXEs, no MQB build or ETW
        shell: pwsh
        run: |
          python tests/native/private129_jobs_contrast.py --input private129-output/original-cumulative.zip --output private129-output/evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve all raw calls, original inputs and partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private129-jobs-contrast-original
          path: private129-output/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
