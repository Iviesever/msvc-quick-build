name: Scheduler Query Diagnostic

on:
  push:
    branches: ['codex/v5.6-scheduler-query-diagnostic']

permissions:
  contents: read
  actions: read

concurrency:
  group: scheduler-query-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    # This experiment consumed its two cases in run 34968263876. Keep its evidence; never resample.
    if: ${{ false }}
    name: Observe existing tools on a fresh hosted Windows runner
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Pure contracts; original binaries only, no compiler build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory allocation -ErrorAction Stop | Out-Null
          python tests/native/scheduler_query_diagnostic.py self-test --output allocation/contracts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve GitHub allocation evidence and fetch original exact tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          Invoke-WebRequest "$api/actions/runs/34965806286/jobs?per_page=100" -Headers $headers -OutFile allocation/original-jobs.json
          Invoke-WebRequest "$api/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" -Headers $headers -OutFile allocation/current-jobs.json
          Invoke-WebRequest "$api/actions/artifacts/10395591731/zip" -Headers $headers -OutFile native-input.zip
          python tests/native/scheduler_query_diagnostic.py reuse --input native-input.zip --output native-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remaining original two-arm budget, no rerun of any case
        shell: pwsh
        env:
          MQB_OWNERSHIP_DISPOSABLE_HOST: '1'
        run: |
          python tests/native/scheduler_query_diagnostic.py observe --input native-input --output scheduler-query-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw evidence and preflight failures
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-query-corrected-evidence
          path: |
            allocation/**
            scheduler-query-evidence/**
            native-input.zip
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
