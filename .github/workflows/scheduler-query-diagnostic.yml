name: Scheduler Query Diagnostic

on:
  push:
    branches: ['codex/v5.6-scheduler-query-diagnostic']

permissions:
  contents: read
  actions: read

concurrency:
  group: scheduler-query-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fixed-source diagnostic tools only
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Portable contracts and exact patch replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'No repeated attempt.' }
          New-Item -ItemType Directory scheduler-query-preflight -ErrorAction Stop | Out-Null
          python tests/native/scheduler_query_diagnostic.py self-test --output scheduler-query-preflight/contracts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Obtain existing fixed MQB builder archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/10339320139/zip" `
            -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} `
            -OutFile scheduler-query-preflight/retained.zip
      - name: One Debug probe, one Release probe, one original recorder build
        shell: pwsh
        run: |
          python tests/native/scheduler_query_diagnostic.py build --input scheduler-query-preflight/retained.zip --output scheduler-query-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact tools, derived source and every build result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-query-input
          path: scheduler-query-input/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve preflight contracts on every outcome
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-query-preflight
          path: |
            scheduler-query-preflight/contracts.json
          if-no-files-found: warn
          retention-days: 30
  observe:
    name: Exactly two ordered scheduler cases on a separate disposable host
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: scheduler-query-input
          path: native-input
      - name: RM-on then RM-off once each, stop on unproven cleanup or collection
        shell: pwsh
        env:
          MQB_OWNERSHIP_DISPOSABLE_HOST: '1'
        run: |
          python tests/native/scheduler_query_diagnostic.py observe --input native-input --output scheduler-query-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw ETLs, binaries, native diagnostics and failures
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scheduler-query-evidence
          path: scheduler-query-evidence/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
