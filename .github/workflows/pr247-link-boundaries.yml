name: PR247 Link Boundary Diagnosis
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tests/diagnostics/pr247_link/**'
      - '.github/workflows/pr247-link-boundaries.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: pr247-link-boundaries-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build-instruments:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/pr247-link-boundaries-001' && github.event.pull_request.base.sha == '399e06fa43d2052ac0d452e1320438c015c65145' && github.run_attempt == 1 && github.event.pull_request.number == 248 && github.event.before == '6074de8e6f7e7946ac35933d093109f47ced118a'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Download the single immutable Performance919 archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/11539029999/zip" `
            -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} -OutFile original919.zip
      - name: Contracts before any compilation
        shell: pwsh
        env:
          PR247_TEST_ARCHIVE: original919.zip
        run: |
          New-Item -ItemType Directory -Path diag-preflight -ErrorAction Stop | Out-Null
          python -m unittest discover -s tests/diagnostics/pr247_link -p 'test_*.py' -v 1>diag-preflight/contracts.stdout 2>diag-preflight/contracts.stderr
          $code = $LASTEXITCODE
          Get-Content diag-preflight/contracts.stdout, diag-preflight/contracts.stderr | Write-Host
          exit $code
      - name: Preserve preflight output including failures
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr247-link-preflight-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diag-preflight/**
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve sources and build two separately identified diagnostic copies
        shell: pwsh
        run: |
          python tests/diagnostics/pr247_link/study.py prepare --archive original919.zip --out diag-input
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr247-link-input-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            diag-input/**
            !diag-input/sources/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
  diagnose:
    needs: build-instruments
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/pr247-link-boundaries-001' && github.event.pull_request.base.sha == '399e06fa43d2052ac0d452e1320438c015c65145' && github.run_attempt == 1 && github.event.pull_request.number == 248 && github.event.before == '6074de8e6f7e7946ac35933d093109f47ced118a'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        with:
          name: pr247-link-input-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diag-input
      - name: One preparation and sixteen fixed link-only invocations on a fresh VM
        shell: pwsh
        run: |
          python tests/diagnostics/pr247_link/study.py measure --inputs diag-input --out diag-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/diagnostics/pr247_link/study.py audit --inputs diag-input --out diag-output
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr247-link-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diag-output/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
