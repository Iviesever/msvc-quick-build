name: Native Release

on:
  pull_request:
    paths:
      - 'cpp/**'
      - 'README.md'
      - 'README_EN.md'
      - 'LICENSE'
      - 'docs/**'
      - 'install.bat'
      - 'install.ps1'
      - 'uninstall.ps1'
      - 'tests/installer/**'
      - 'tests/native/**'
      - 'tests/selfhost/**'
      - 'release/**'
      - '.github/workflows/native-release.yml'
  push:
    tags:
      - 'v*'

jobs:
  build-test-package:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package_name: ${{ steps.meta.outputs.package_name }}
      notes_file: ${{ steps.meta.outputs.notes_file }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'release/VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid release/VERSION value: '$version'"
          }

          $tag = "v$version"
          $packageName = "msvc-quick-build-$tag-windows-x64"
          $notesFile = "release/$tag.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes not found: $notesFile"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if (-not $env:GITHUB_REF.StartsWith('refs/tags/')) {
              throw "Release publication must be triggered by a tag, got '$env:GITHUB_REF'"
            }
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "Tag/version mismatch: pushed '$env:GITHUB_REF_NAME', release/VERSION requires '$tag'"
            }
          }

          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Package: $packageName"

      - name: Acquire pinned historical MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      # Stage 0 is built by MQB, not CMake. It is a test/bootstrap generation only.
      - name: Build Stage 0 Release MQB with MQB
        id: stage0
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version $env:MQB_RELEASE_VERSION `
            -Configuration Release `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/release/stage0/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$mqb" >> $env:GITHUB_OUTPUT

      - name: Run 67 MQB-native Release tests
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath '${{ steps.stage0.outputs.path }}' `
            -TestMqbPath '${{ steps.stage0.outputs.path }}' `
            -RepoRoot $PWD `
            -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-host stable release with MQB
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & (Join-Path $PWD 'tests/selfhost/selfhost.ps1') `
            -BootstrapMqbPath '${{ steps.stage0.outputs.path }}' `
            -RepoRoot $PWD `
            -ReleaseVersion $env:MQB_RELEASE_VERSION `
            -OutputRoot (Join-Path $PWD 'selfhost-out')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release package
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MQB_PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          MQB_NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
        run: |
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist $env:MQB_PACKAGE_NAME
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Stable releases package Stage 1: the binary produced by MQB itself.
          Copy-Item 'selfhost-out/stage1/mqb.exe' (Join-Path $stage 'mqb.exe')
          Copy-Item 'install.bat' (Join-Path $stage 'install.bat')
          Copy-Item 'install.ps1' (Join-Path $stage 'install.ps1')
          Copy-Item 'uninstall.ps1' (Join-Path $stage 'uninstall.ps1')
          Copy-Item 'README.md' (Join-Path $stage 'README.md')
          Copy-Item 'README_EN.md' (Join-Path $stage 'README_EN.md')
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE')
          Copy-Item 'docs/MQB_CONFIG.md' (Join-Path $stage 'MQB_CONFIG.md')
          Copy-Item 'docs/MQB_CONFIG_EN.md' (Join-Path $stage 'MQB_CONFIG_EN.md')
          Copy-Item 'docs/ARCHITECTURE.md' (Join-Path $stage 'ARCHITECTURE.md')
          Copy-Item 'docs/ARCHITECTURE_EN.md' (Join-Path $stage 'ARCHITECTURE_EN.md')
          Copy-Item 'docs/INSTALLATION.md' (Join-Path $stage 'INSTALLATION.md')
          Copy-Item 'docs/SELF_HOSTING.md' (Join-Path $stage 'SELF_HOSTING.md')
          Copy-Item 'docs/SELF_HOSTING_EN.md' (Join-Path $stage 'SELF_HOSTING_EN.md')

          $releaseNotes = Join-Path $stage 'RELEASE_NOTES.md'
          $releaseNotesEn = Join-Path $stage 'RELEASE_NOTES_EN.md'
          $notesEnFile = "release/v$($env:MQB_RELEASE_VERSION)_EN.md"
          if (-not (Test-Path -LiteralPath $notesEnFile -PathType Leaf)) {
            throw "English release notes not found: $notesEnFile"
          }
          Copy-Item $env:MQB_NOTES_FILE $releaseNotes
          Copy-Item $notesEnFile $releaseNotesEn

          $zhNotes = (Get-Content -LiteralPath $releaseNotes -Raw).Replace(
            "(v$($env:MQB_RELEASE_VERSION)_EN.md)",
            '(RELEASE_NOTES_EN.md)'
          )
          Set-Content -LiteralPath $releaseNotes -Value $zhNotes -Encoding utf8NoBOM -NoNewline

          $enNotes = (Get-Content -LiteralPath $releaseNotesEn -Raw).Replace(
            "(v$($env:MQB_RELEASE_VERSION).md)",
            '(RELEASE_NOTES.md)'
          )
          Set-Content -LiteralPath $releaseNotesEn -Value $enNotes -Encoding utf8NoBOM -NoNewline

          $zip = Join-Path $dist ($env:MQB_PACKAGE_NAME + '.zip')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $shaPath = $zip + '.sha256'
          "$hash  $($env:MQB_PACKAGE_NAME).zip" | Set-Content -LiteralPath $shaPath -Encoding ascii -NoNewline

          Write-Host "Package: $zip"
          Write-Host "SHA256:  $hash"

      - name: Validate exact packaged artifact
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MQB_PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: |
          $dist = Join-Path $PWD 'dist'
          $zip = Join-Path $dist ($env:MQB_PACKAGE_NAME + '.zip')
          $shaPath = $zip + '.sha256'
          $verifyRoot = Join-Path $dist 'verify-extracted'

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing package: $zip" }
          if (-not (Test-Path -LiteralPath $shaPath -PathType Leaf)) { throw "Missing checksum: $shaPath" }

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expectedShaLine = "$actualHash  $($env:MQB_PACKAGE_NAME).zip"
          $shaLine = (Get-Content -LiteralPath $shaPath -Raw).Trim()
          if ($shaLine -ne $expectedShaLine) {
            throw "Checksum sidecar mismatch. Expected '$expectedShaLine', got '$shaLine'"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $verifyRoot
          $expectedFiles = @(
            'ARCHITECTURE.md',
            'ARCHITECTURE_EN.md',
            'INSTALLATION.md',
            'install.bat',
            'install.ps1',
            'LICENSE',
            'MQB_CONFIG.md',
            'MQB_CONFIG_EN.md',
            'mqb.exe',
            'README.md',
            'README_EN.md',
            'RELEASE_NOTES.md',
            'RELEASE_NOTES_EN.md',
            'SELF_HOSTING.md',
            'SELF_HOSTING_EN.md',
            'uninstall.ps1'
          ) | Sort-Object
          $actualFiles = @(Get-ChildItem -LiteralPath $verifyRoot -File | Select-Object -ExpandProperty Name | Sort-Object)
          $manifestDiff = @(Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles)
          if ($manifestDiff.Count -ne 0) {
            $manifestDiff | Format-Table | Out-String | Write-Host
            throw 'Release package manifest differs from the stable native self-hosting contract.'
          }

          $selfHostedMqb = Join-Path $PWD 'selfhost-out/stage1/mqb.exe'
          $packagedMqb = Join-Path $verifyRoot 'mqb.exe'
          $selfHostedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $selfHostedMqb).Hash
          $packagedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagedMqb).Hash
          if ($selfHostedHash -ne $packagedHash) {
            throw 'Packaged mqb.exe is not byte-identical to the validated Stage 1 self-hosted binary.'
          }

          $help = @(& $packagedMqb --help 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0 -or $help.Count -eq 0) { throw 'Packaged mqb.exe --help failed.' }
          $expectedHelp = "MQB $env:MQB_RELEASE_VERSION - MSVC Quick Build (C++ refactor)"
          if ($help[0] -ne $expectedHelp) {
            throw "Packaged embedded version mismatch. Expected '$expectedHelp', got '$($help[0])'"
          }

          $zhNotes = Get-Content -LiteralPath (Join-Path $verifyRoot 'RELEASE_NOTES.md') -Raw
          $enNotes = Get-Content -LiteralPath (Join-Path $verifyRoot 'RELEASE_NOTES_EN.md') -Raw
          if (-not $zhNotes.Contains('(RELEASE_NOTES_EN.md)')) {
            throw 'Packaged Chinese release notes do not link to RELEASE_NOTES_EN.md.'
          }
          if (-not $enNotes.Contains('(RELEASE_NOTES.md)')) {
            throw 'Packaged English release notes do not link to RELEASE_NOTES.md.'
          }

          & (Join-Path $PWD 'tests/installer/native_installer_lifecycle.ps1') `
            -MqbPath $packagedMqb `
            -RepoRoot $verifyRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged installer lifecycle failed with exit code $LASTEXITCODE"
          }

          Write-Host 'Exact self-hosted packaged artifact validation passed.'

      - name: Validate GitHub Release notes body
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MQB_NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
        run: |
          $tag = "v$env:MQB_RELEASE_VERSION"
          $notesEnFile = "release/v$($env:MQB_RELEASE_VERSION)_EN.md"
          if (-not (Test-Path -LiteralPath $env:MQB_NOTES_FILE -PathType Leaf)) {
            throw "Missing release notes: $env:MQB_NOTES_FILE"
          }
          if (-not (Test-Path -LiteralPath $notesEnFile -PathType Leaf)) {
            throw "Missing English release notes: $notesEnFile"
          }

          $sourceNotes = Get-Content -LiteralPath $env:MQB_NOTES_FILE -Raw
          $sourceEnglishLink = "(v$($env:MQB_RELEASE_VERSION)_EN.md)"
          if (-not $sourceNotes.Contains($sourceEnglishLink)) {
            throw "Release notes do not contain expected English link target: $sourceEnglishLink"
          }

          $taggedEnglishTarget = "https://github.com/$env:GITHUB_REPOSITORY/blob/$tag/release/v$($env:MQB_RELEASE_VERSION)_EN.md"
          $rendered = $sourceNotes.Replace($sourceEnglishLink, "($taggedEnglishTarget)")
          if (-not $rendered.Contains("($taggedEnglishTarget)")) {
            throw 'GitHub Release notes body did not receive the exact-tag English link.'
          }
          Write-Host "GitHub Release English notes target: $taggedEnglishTarget"

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: |
            dist/${{ steps.meta.outputs.package_name }}.zip
            dist/${{ steps.meta.outputs.package_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MQB_RELEASE_VERSION: ${{ needs.build-test-package.outputs.version }}
      MQB_PACKAGE_NAME: ${{ needs.build-test-package.outputs.package_name }}
      MQB_NOTES_FILE: ${{ needs.build-test-package.outputs.notes_file }}
      MQB_PRERELEASE: ${{ needs.build-test-package.outputs.prerelease }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Download exact validated package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MQB_PACKAGE_NAME }}
          path: dist-publish

      - name: Verify publication inputs
        shell: pwsh
        run: |
          $tag = "v$env:MQB_RELEASE_VERSION"
          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag/version mismatch before publication: '$env:GITHUB_REF_NAME' vs '$tag'"
          }
          if (-not (Test-Path -LiteralPath $env:MQB_NOTES_FILE -PathType Leaf)) {
            throw "Missing release notes: $env:MQB_NOTES_FILE"
          }
          $notesEnFile = "release/v$($env:MQB_RELEASE_VERSION)_EN.md"
          if (-not (Test-Path -LiteralPath $notesEnFile -PathType Leaf)) {
            throw "Missing English release notes: $notesEnFile"
          }

          $zip = Join-Path $PWD "dist-publish/$($env:MQB_PACKAGE_NAME).zip"
          $sha = $zip + '.sha256'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing validated package: $zip" }
          if (-not (Test-Path -LiteralPath $sha -PathType Leaf)) { throw "Missing validated checksum: $sha" }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expected = "$hash  $($env:MQB_PACKAGE_NAME).zip"
          $actual = (Get-Content -LiteralPath $sha -Raw).Trim()
          if ($actual -ne $expected) {
            throw "Downloaded artifact checksum mismatch. Expected '$expected', got '$actual'"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Stable release publication is immutable; refusing to overwrite it."
          }
          exit 0

      - name: Publish validated GitHub release
        shell: pwsh
        run: |
          $tag = "v$env:MQB_RELEASE_VERSION"
          $zip = Join-Path $PWD "dist-publish/$($env:MQB_PACKAGE_NAME).zip"
          $sha = $zip + '.sha256'
          $title = if ($env:MQB_PRERELEASE -eq 'true') {
            "$tag — Native Prerelease"
          } else {
            "$tag — Stable Release"
          }

          $sourceNotes = Get-Content -LiteralPath $env:MQB_NOTES_FILE -Raw
          $sourceEnglishLink = "(v$($env:MQB_RELEASE_VERSION)_EN.md)"
          if (-not $sourceNotes.Contains($sourceEnglishLink)) {
            throw "Release notes do not contain expected English link target: $sourceEnglishLink"
          }
          $taggedEnglishTarget = "https://github.com/$env:GITHUB_REPOSITORY/blob/$tag/release/v$($env:MQB_RELEASE_VERSION)_EN.md"
          $releaseBody = Join-Path $PWD 'release-body.md'
          $sourceNotes.Replace($sourceEnglishLink, "($taggedEnglishTarget)") |
            Set-Content -LiteralPath $releaseBody -Encoding utf8NoBOM -NoNewline

          $arguments = @(
            'release', 'create', $tag, $zip, $sha,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', $title,
            '--notes-file', $releaseBody
          )
          if ($env:MQB_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
