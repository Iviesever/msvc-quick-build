name: Native Release

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'cpp/**'
      - 'LICENSE'
      - 'install.bat'
      - 'install.ps1'
      - 'uninstall.bat'
      - 'uninstall.ps1'
      - 'tests/installer/**'
      - 'tests/native/**'
      - 'tests/selfhost/**'
      - '.github/workflows/native-release.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - '.github/workflows/native-release.yml'

jobs:
  build-test-package:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package_name: ${{ steps.meta.outputs.package_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid VERSION value: '$version'"
          }

          $tag = "v$version"
          $packageName = "msvc-quick-build-$tag-windows-x64"
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Release publication must come from main, got '$env:GITHUB_REF'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Package: $packageName"

      - name: Acquire pinned historical MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build Stage 0 Release MQB with MQB
        id: stage0
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version $env:MQB_RELEASE_VERSION `
            -Configuration Release `
            -Clean `
            -OutputPath (Join-Path $PWD 'native-out/release/stage0/mqb.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$mqb" >> $env:GITHUB_OUTPUT

      - name: Run MQB-native Release tests
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/run_native_tests.ps1') `
            -BuilderMqbPath '${{ steps.stage0.outputs.path }}' `
            -TestMqbPath '${{ steps.stage0.outputs.path }}' `
            -RepoRoot $PWD `
            -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-host stable release with MQB
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & (Join-Path $PWD 'tests/selfhost/selfhost.ps1') `
            -BootstrapMqbPath '${{ steps.stage0.outputs.path }}' `
            -RepoRoot $PWD `
            -ReleaseVersion $env:MQB_RELEASE_VERSION `
            -OutputRoot (Join-Path $PWD 'selfhost-out')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage runtime-only release package
        shell: pwsh
        env:
          MQB_PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: |
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist $env:MQB_PACKAGE_NAME
          if (Test-Path -LiteralPath $dist) {
            Remove-Item -LiteralPath $dist -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # The stable ZIP is intentionally runtime/install-only. User documentation
          # stays in the repository and on GitHub Releases; Apache-2.0 LICENSE remains
          # in the binary redistribution as required by the license.
          Copy-Item 'selfhost-out/stage1/mqb.exe' (Join-Path $stage 'mqb.exe')
          Copy-Item 'VERSION' (Join-Path $stage 'VERSION')
          Copy-Item 'install.bat' (Join-Path $stage 'install.bat')
          Copy-Item 'install.ps1' (Join-Path $stage 'install.ps1')
          Copy-Item 'uninstall.bat' (Join-Path $stage 'uninstall.bat')
          Copy-Item 'uninstall.ps1' (Join-Path $stage 'uninstall.ps1')
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE')

          $zip = Join-Path $dist ($env:MQB_PACKAGE_NAME + '.zip')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $shaPath = $zip + '.sha256'
          "$hash  $($env:MQB_PACKAGE_NAME).zip" | Set-Content -LiteralPath $shaPath -Encoding ascii -NoNewline

          Write-Host "Package: $zip"
          Write-Host "SHA256:  $hash"

      - name: Validate exact runtime-only packaged artifact
        shell: pwsh
        env:
          MQB_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MQB_PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: |
          $dist = Join-Path $PWD 'dist'
          $zip = Join-Path $dist ($env:MQB_PACKAGE_NAME + '.zip')
          $shaPath = $zip + '.sha256'
          $verifyRoot = Join-Path $dist 'verify-extracted'

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Missing package: $zip"
          }
          if (-not (Test-Path -LiteralPath $shaPath -PathType Leaf)) {
            throw "Missing checksum: $shaPath"
          }

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expectedShaLine = "$actualHash  $($env:MQB_PACKAGE_NAME).zip"
          $shaLine = (Get-Content -LiteralPath $shaPath -Raw).Trim()
          if ($shaLine -ne $expectedShaLine) {
            throw "Checksum sidecar mismatch. Expected '$expectedShaLine', got '$shaLine'"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $verifyRoot

          $directories = @(Get-ChildItem -LiteralPath $verifyRoot -Directory -Force)
          if ($directories.Count -ne 0) {
            $directories | Select-Object -ExpandProperty Name | Write-Host
            throw 'Release ZIP must be flat and must not contain documentation/resource directories.'
          }

          $expectedFiles = @(
            'install.bat',
            'install.ps1',
            'LICENSE',
            'mqb.exe',
            'uninstall.bat',
            'uninstall.ps1',
            'VERSION'
          ) | Sort-Object
          $actualFiles = @(Get-ChildItem -LiteralPath $verifyRoot -File -Force | Select-Object -ExpandProperty Name | Sort-Object)
          $manifestDiff = @(Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles)
          if ($manifestDiff.Count -ne 0) {
            $manifestDiff | Format-Table | Out-String | Write-Host
            throw 'Release package manifest differs from the runtime-only stable contract.'
          }

          $forbiddenDocs = @(Get-ChildItem -LiteralPath $verifyRoot -File -Force | Where-Object {
            $_.Name -match '^(README|RELEASE_NOTES)' -or
            $_.Extension -in @('.md', '.markdown', '.rst', '.txt')
          })
          if ($forbiddenDocs.Count -ne 0) {
            $forbiddenDocs | Select-Object -ExpandProperty Name | Write-Host
            throw 'User documentation must not be shipped inside the stable ZIP.'
          }

          $selfHostedMqb = Join-Path $PWD 'selfhost-out/stage1/mqb.exe'
          $packagedMqb = Join-Path $verifyRoot 'mqb.exe'
          $selfHostedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $selfHostedMqb).Hash
          $packagedMqbHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagedMqb).Hash
          if ($selfHostedHash -ne $packagedMqbHash) {
            throw 'Packaged mqb.exe is not byte-identical to the validated Stage 1 self-hosted binary.'
          }

          $packagedVersion = (Get-Content -LiteralPath (Join-Path $verifyRoot 'VERSION') -Raw).Trim()
          if ($packagedVersion -ne $env:MQB_RELEASE_VERSION) {
            throw "Packaged VERSION mismatch: '$packagedVersion' vs '$env:MQB_RELEASE_VERSION'"
          }

          $help = @(& $packagedMqb --help 2>&1 | ForEach-Object { $_.ToString() })
          if ($LASTEXITCODE -ne 0 -or $help.Count -eq 0) {
            throw 'Packaged mqb.exe --help failed.'
          }
          $expectedHelp = "MQB $env:MQB_RELEASE_VERSION - MSVC Quick Build (C++ refactor)"
          if ($help[0] -ne $expectedHelp) {
            throw "Packaged embedded version mismatch. Expected '$expectedHelp', got '$($help[0])'"
          }

          & (Join-Path $PWD 'tests/installer/native_installer_lifecycle.ps1') `
            -MqbPath $packagedMqb `
            -RepoRoot $verifyRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged installer lifecycle failed with exit code $LASTEXITCODE"
          }

          Write-Host 'Exact runtime-only self-hosted package validation passed.'

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: |
            dist/${{ steps.meta.outputs.package_name }}.zip
            dist/${{ steps.meta.outputs.package_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MQB_RELEASE_VERSION: ${{ needs.build-test-package.outputs.version }}
      MQB_PACKAGE_NAME: ${{ needs.build-test-package.outputs.package_name }}
      MQB_PRERELEASE: ${{ needs.build-test-package.outputs.prerelease }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Download exact validated package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.MQB_PACKAGE_NAME }}
          path: dist-publish

      - name: Verify publication inputs and immutable identity
        id: preflight
        shell: pwsh
        run: |
          $tag = "v$env:MQB_RELEASE_VERSION"
          $zip = Join-Path $PWD "dist-publish/$($env:MQB_PACKAGE_NAME).zip"
          $sha = $zip + '.sha256'

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Missing validated package: $zip"
          }
          if (-not (Test-Path -LiteralPath $sha -PathType Leaf)) {
            throw "Missing validated checksum: $sha"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expected = "$hash  $($env:MQB_PACKAGE_NAME).zip"
          $actual = (Get-Content -LiteralPath $sha -Raw).Trim()
          if ($actual -ne $expected) {
            throw "Downloaded artifact checksum mismatch. Expected '$expected', got '$actual'"
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; immutable publication is already complete."
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }

          & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists without a release. Refusing ambiguous publication."
          }

          'publish=true' >> $env:GITHUB_OUTPUT
          exit 0

      - name: Publish validated GitHub release
        if: steps.preflight.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = "v$env:MQB_RELEASE_VERSION"
          $zip = Join-Path $PWD "dist-publish/$($env:MQB_PACKAGE_NAME).zip"
          $sha = $zip + '.sha256'
          $title = if ($env:MQB_PRERELEASE -eq 'true') {
            "$tag — Native Prerelease"
          } else {
            "$tag — Stable Release"
          }

          $arguments = @(
            'release', 'create', $tag, $zip, $sha,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', $title,
            '--generate-notes'
          )
          if ($env:MQB_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,url | ConvertFrom-Json
          if ($release.tagName -ne $tag -or $release.isDraft) {
            throw "Published release identity validation failed for $tag"
          }
          Write-Host "Published release: $($release.url)"
