name: Build Plan Evidence

on:
  pull_request:
    paths:
      - 'cpp/mqb.json'
      - 'cpp/src/app/main.cpp'
      - 'cpp/src/app/targets/BuildIntrospectionSetup.cpp'
      - 'cpp/src/app/targets/BuildIntrospectionSetup.hpp'
      - 'cpp/src/app/targets/PlanCommand.cpp'
      - 'cpp/src/app/targets/PlanCommand.hpp'
      - 'cpp/include/mqb/msvc/MsvcCompiler.hpp'
      - 'cpp/include/mqb/msvc/MsvcCompileExecutor.hpp'
      - 'cpp/include/mqb/msvc/MsvcLinker.hpp'
      - 'cpp/include/mqb/msvc/MsvcLibrarian.hpp'
      - 'cpp/src/msvc/compiler/**'
      - 'cpp/src/msvc/linker/**'
      - 'cpp/src/msvc/librarian/**'
      - 'cpp/include/mqb/orchestration/MsvcIncrementalCompileCoordinator.hpp'
      - 'cpp/include/mqb/orchestration/MsvcIncrementalLinkCoordinator.hpp'
      - 'cpp/include/mqb/orchestration/MsvcIncrementalArchiveCoordinator.hpp'
      - 'cpp/include/mqb/orchestration/MsvcIncrementalPchCoordinator.hpp'
      - 'cpp/src/orchestration/incremental/MsvcIncrementalCompileCoordinator.cpp'
      - 'cpp/src/orchestration/incremental/MsvcIncrementalLinkCoordinator.cpp'
      - 'cpp/src/orchestration/incremental/MsvcIncrementalArchiveCoordinator.cpp'
      - 'cpp/src/orchestration/incremental/MsvcIncrementalPchCoordinator.cpp'
      - 'cpp/tests/msvc/librarian/librarian_arguments_tests.cpp'
      - 'cpp/src/core/**'
      - 'tests/native/assert_cpp_layout.ps1'
      - 'tests/native/verify_plan.ps1'
      - '.github/workflows/plan-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-plan:
    name: Verify side-effect-free build plan
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Acquire pinned MQB seed
        id: seed
        shell: pwsh
        run: |
          $seed = & (Join-Path $PWD 'tests/native/acquire_seed.ps1') `
            -RepoRoot $PWD `
            -OutputRoot (Join-Path $PWD 'native-seed')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$seed" >> $env:GITHUB_OUTPUT

      - name: Build current Release MQB
        id: current
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $output = Join-Path $PWD 'native-out/plan-candidate/mqb.exe'
          $mqb = & (Join-Path $PWD 'tests/native/build_mqb.ps1') `
            -BuilderMqbPath '${{ steps.seed.outputs.path }}' `
            -RepoRoot $PWD `
            -Version "$version-plan" `
            -Configuration Release `
            -Clean `
            -OutputPath $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $mqb -PathType Leaf)) {
            throw "Release MQB build output missing: $mqb"
          }
          "path=$mqb" >> $env:GITHUB_OUTPUT

      - name: Verify build plan contract
        shell: pwsh
        run: |
          & (Join-Path $PWD 'tests/native/verify_plan.ps1') `
            -MqbPath '${{ steps.current.outputs.path }}' `
            -RepoRoot $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
