name: Private129 checkpoint adjacency once
on:
  push:
    branches: ['codex/private129-checkpoint-once-20260917']
permissions:
  contents: read
  actions: read
concurrency:
  group: private129-checkpoint-once-20260917
  cancel-in-progress: false
jobs:
  contrast:
    if: github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/codex/private129-checkpoint-once-20260917'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pure contracts and retained original input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory checkpoint-output -ErrorAction Stop | Out-Null
          python tests/native/private129_checkpoint_contrast.py --self-test 1>checkpoint-output/self-test.stdout 2>checkpoint-output/self-test.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          Invoke-WebRequest 'https://api.github.com/repos/Iviesever/msvc-quick-build/actions/artifacts/10483674322/zip' -Headers $headers -OutFile checkpoint-output/prior-original.zip
      - name: Fixed 54 MQB calls and 24 historical checkpoint actions
        shell: pwsh
        run: |
          python tests/native/private129_checkpoint_contrast.py --input checkpoint-output/prior-original.zip --output checkpoint-output/evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete diagnostics and partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private129-checkpoint-original
          path: checkpoint-output/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
